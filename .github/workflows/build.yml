#
# Test on every push/PR; publish + release ONLY on a `v*` git tag.
#
# Platform contract (management-service):
#   - A deployable "version" == a TAG on the GHCR image. ListImageTags reads
#     the registry tags, so publishing on every push (branch/latest/<sha>
#     tags) floods the version picker. We publish exactly ONE semver tag,
#     and only for a git tag -> no tag, no image.
#   - provenance/sbom are OFF and the build is single-arch linux/amd64: an
#     OCI attestation index would change the digest the enclave pins at
#     OID 1.3.6.1.4.1.65230.3.2.
#   - Each release records that digest (Measurements table) and cosign-signs
#     it, so git tag <-> image digest <-> commit is auditable.

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/privasys/container-app-lightpanda

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # cut the GitHub Release
      packages: write      # push to GHCR
      id-token: write       # cosign keyless (Fulcio/Rekor OIDC)
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Embed privasys.json (MCP manifest) as the org.privasys.manifest OCI
      # label so mgmt-service auto-detects tools/UI. base64 so the CSV-style
      # label parser can't mangle interior quotes/commas; mgmt decodes it.
      - name: Read privasys.json
        id: manifest
        run: |
          if [ -f privasys.json ]; then
            echo "json=$(jq -c . privasys.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.privasys.manifest=${{ steps.manifest.outputs.json }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Cut GitHub Release (Measurements)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          ## Measurements

          | Measurement | Value |
          |-------------|-------|
          | **Workload image digest** | \`${DIGEST}\` |
          | **Attestation OID** | \`1.3.6.1.4.1.65230.3.2\` |
          | **Pinned reference** | \`${IMAGE}@${DIGEST}\` |
          | **Source commit** | \`${SHA}\` |

          The workload image digest is the SHA-256 manifest digest of the published
          container image. The enclave measures it into the RA-TLS leaf certificate
          at OID **1.3.6.1.4.1.65230.3.2**; clients verify the running app is exactly
          this image by inspecting the TDX quote in the server certificate. The image
          is cosign-signed (keyless, Fulcio/Rekor) against the same digest.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "## ${{ steps.tag.outputs.tag }} published"
            echo
            echo '**Pinned reference (reproducible deploys):**'
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
